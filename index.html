<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pátria Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #58a6ff;
        }

        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pátria Games</h1>
        <p>Nosso site está em desenvolvimento. Em breve compartilharemos novidades e nossos projetos por aqui!</p>
        <a href="https://github.com/patriagames" class="btn" target="_blank">Acesse nosso GitHub</a>
    </div>

    <footer>
        &copy; Pátria Games. Todos os direitos reservados.
    </footer>

</body>
</html>
